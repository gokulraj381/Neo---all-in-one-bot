; Neo - all-in-one desk bot for the Waveshare ESP32-S3-LCD-1.28 (non-touch)

[env:neo]
platform = espressif32 @ 6.5.0
board = waveshare_esp32s3_lcd_128
framework = arduino
monitor_speed = 115200
lib_deps =
  Bodmer/TFT_eSPI @ 2.5.43
build_flags =
  -D USER_SETUP_LOADED=1
  -include include/TFT_Setup_ESP32S3_LCD_128.h
